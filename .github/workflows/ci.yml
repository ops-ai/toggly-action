name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Run unit tests
        shell: bash
        run: |
          if command -v python3 >/dev/null 2>&1; then PY=python3; else PY=python; fi
          "$PY" -m unittest discover -s tests -v

  action-help:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned CLI and run --help
        uses: ./
        with:
          version: "0.2.1"
          args: "--help"

  action-no-credentials:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: create-feature --help without credentials
        id: help_cmd
        continue-on-error: true
        uses: ./
        with:
          version: "0.2.1"
          args: "create-feature --help"
      - name: Assert help succeeded and secret was not printed
        # create-feature --help exits 0 without credentials. Secret leakage is
        # covered by unit tests (SecretLoggingTests). Fail the job if a dummy
        # secret string appears in this step's logs (none are set).
        run: |
          set -euo pipefail
          if [[ "${{ steps.help_cmd.outcome }}" != "success" ]]; then
            echo "expected create-feature --help to succeed"
            exit 1
          fi
          # No dummy secret is provided to this job; guard against accidental env.
          if printenv | grep -qi 'TOGGLY_CLIENT_SECRET='; then
            echo "TOGGLY_CLIENT_SECRET must not be set in this CI job"
            exit 1
          fi
